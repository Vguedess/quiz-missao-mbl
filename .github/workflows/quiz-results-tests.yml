name: Quiz — score & storage checks
on:
  push:
    branches: [main, feature/analytics-postgres]
  pull_request:
    paths:
      - '**/*.js'
      - 'package.json'
      - '.github/workflows/quiz-results-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Scoring tests
        run: npm test
      - name: Syntax checks
        run: npm run check
